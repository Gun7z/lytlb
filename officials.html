<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>洛亚提自由联邦 · 官员职位表</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  --ink:#2b2119;
  --ink-soft:#6a5a46;
  --paper:#efe4cd;
  --paper-lt:#faf3e2;
  --gold:#b08a4a;
  --gold-dp:#84642f;
  --seal:#8c2f28;
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{
  color:var(--ink);
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background-color:var(--paper);
  background-image:
    radial-gradient(circle at 22% 12%, rgba(255,255,255,.65), transparent 42%),
    radial-gradient(circle at 82% 78%, rgba(176,138,74,.22), transparent 52%),
    repeating-linear-gradient(0deg, rgba(120,90,50,.055) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(120,90,50,.04) 0 1px, transparent 1px 4px);
  background-attachment:fixed;
  padding:clamp(24px,4.5vw,56px) 20px 56px;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1040px;margin:0 auto;}

/* ===== 页眉 ===== */
.hero{text-align:center;margin-bottom:clamp(22px,4vw,40px);}
.crown{width:58px;height:auto;color:var(--gold-dp);margin-bottom:12px;}
.kicker{
  font-size:11px;letter-spacing:.42em;text-transform:uppercase;
  color:var(--gold-dp);margin:0 0 10px;font-weight:500;
}
.hero h1{
  font-family:"Noto Serif SC","Songti SC",serif;
  font-weight:900;letter-spacing:.08em;
  font-size:clamp(1.8rem,5.2vw,2.9rem);margin:0;line-height:1.2;
  color:#241b13;
}
.rule{
  display:flex;align-items:center;justify-content:center;gap:12px;
  margin:16px auto 14px;max-width:420px;
}
.rule::before,.rule::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold));}
.rule::after{background:linear-gradient(90deg,var(--gold),transparent);}
.rule span{
  width:7px;height:7px;transform:rotate(45deg);
  border:1px solid var(--gold-dp);background:rgba(255,255,255,.6);
}
.hero .sub{
  margin:0;font-size:clamp(.74rem,2.2vw,.9rem);letter-spacing:.16em;
  color:var(--ink-soft);
}

/* ===== 工具条 ===== */
.toolbar{
  display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  margin:18px auto 0;
}
.btn{
  font-family:inherit;font-size:.76rem;letter-spacing:.12em;cursor:pointer;
  padding:8px 15px;border-radius:2px;color:var(--ink);
  background:linear-gradient(180deg,#fdf7e9,#f0e4cd);
  border:1px solid rgba(132,99,47,.45);
  transition:background .2s,border-color .2s,transform .2s;
}
.btn:hover{background:#fff8e8;border-color:rgba(132,99,47,.8);transform:translateY(-1px);}
.btn:disabled{opacity:.55;cursor:progress;transform:none;}
.btn--main{
  color:#5f4419;border-color:rgba(132,99,47,.75);
  background:linear-gradient(180deg,#f8e7bd,#e9d299);
  font-weight:500;
}
.btn--ghost{background:transparent;border-style:dashed;color:var(--ink-soft);}
.hint{
  display:block;text-align:center;font-size:.72rem;color:rgba(106,90,70,.85);
  margin:12px auto 0;letter-spacing:.04em;
}

/* ===== 层级连接线 ===== */
.link{height:clamp(26px,4vw,38px);position:relative;}
.link::before{
  content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;
  background:linear-gradient(180deg,rgba(176,138,74,0),var(--gold) 40%,var(--gold) 60%,rgba(176,138,74,0));
}
.link::after{
  content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;
  transform:translate(-50%,-50%) rotate(45deg);
  border:1px solid var(--gold-dp);background:var(--paper-lt);
  box-shadow:0 0 0 3px rgba(239,228,205,.9);
}

/* ===== 层标题 ===== */
.tier{animation:rise .6s cubic-bezier(.2,.7,.2,1) both;}
@keyframes rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
.tier-head{
  display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  margin-bottom:14px;
}
.idx{
  font-family:"Noto Serif SC",serif;font-size:.7rem;letter-spacing:.1em;
  width:24px;height:24px;line-height:23px;text-align:center;border-radius:50%;
  border:1px solid var(--gold);color:var(--gold-dp);flex:none;
}
.tier-head h2{
  font-family:"Noto Serif SC","Songti SC",serif;font-weight:700;
  font-size:clamp(1.1rem,3vw,1.45rem);margin:0;letter-spacing:.1em;
}
.tier-head .en{
  font-size:10px;letter-spacing:.26em;text-transform:uppercase;
  color:var(--gold-dp);
}
.add{
  font-family:inherit;font-size:.68rem;letter-spacing:.1em;cursor:pointer;
  padding:4px 10px;border-radius:999px;color:var(--gold-dp);
  background:rgba(255,255,255,.35);border:1px dashed rgba(132,99,47,.55);
  transition:background .2s,color .2s;
}
.add:hover{background:#fff6e4;color:#6f4f22;}

/* ===== 卡片基础 ===== */
.card{
  position:relative;
  background:linear-gradient(180deg,#fcf6e8,#f2e7d1);
  border:1px solid rgba(132,99,47,.45);
  border-radius:2px;
  box-shadow:0 10px 26px -18px rgba(60,42,20,.6), inset 0 0 0 1px rgba(255,255,255,.55);
}

/* ===== 人员卡片 ===== */
.person{
  position:relative;
  display:flex;gap:14px;align-items:flex-start;
  padding:16px 18px;
  background:linear-gradient(180deg,#fdf7e9,#f2e7d1);
  border:1px solid rgba(132,99,47,.4);
  border-radius:2px;
  box-shadow:0 10px 24px -20px rgba(60,42,20,.6), inset 0 0 0 1px rgba(255,255,255,.5);
  cursor:pointer;
  transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
}
.person:hover{
  transform:translateY(-3px);border-color:rgba(132,99,47,.8);
  box-shadow:0 16px 30px -20px rgba(60,42,20,.7), inset 0 0 0 1px rgba(255,255,255,.6);
}
.person:hover .del{opacity:1;}

.avatar{
  width:64px;height:64px;flex:none;border-radius:3px;overflow:hidden;
  border:1px solid rgba(132,99,47,.6);
  background:radial-gradient(circle at 35% 25%,#fbf1dc,#e3d2b4);
  display:flex;align-items:center;justify-content:center;
  position:relative;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.55);
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;image-rendering:pixelated;}
.avatar .ph{width:36px;height:36px;color:rgba(132,99,47,.55);}
.avatar .ph svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.4;}

.pbody{min-width:0;flex:1;}
.plead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.plead h3{
  font-family:"Noto Serif SC",serif;font-weight:700;letter-spacing:.06em;
  font-size:1rem;margin:0;line-height:1.35;
  word-break:break-word;
}
.prole{
  display:inline-block;margin-top:5px;
  font-size:.68rem;letter-spacing:.14em;color:var(--seal);
  border:1px solid rgba(140,47,40,.28);background:rgba(140,47,40,.06);
  border-radius:2px;padding:2px 7px;
}
.bio{
  margin:8px 0 0;font-size:.79rem;line-height:1.75;color:var(--ink-soft);
  letter-spacing:.02em;word-break:break-word;
}
.del{
  position:absolute;top:6px;right:6px;
  width:20px;height:20px;line-height:17px;text-align:center;
  font-size:13px;color:#8c2f28;cursor:pointer;
  background:rgba(255,255,255,.6);border:1px solid rgba(140,47,40,.3);border-radius:50%;
  opacity:0;transition:opacity .2s,background .2s;padding:0;
}
.del:hover{background:#fff;}
.del:focus{opacity:1;}

/* 元首大卡 */
.person--lead{
  max-width:640px;margin:0 auto;padding:22px 26px;
  border-color:rgba(132,99,47,.65);
  background:linear-gradient(180deg,#fef9ee,#f4e9d3);
}
.person--lead .avatar{width:88px;height:88px;}
.person--lead .plead h3{font-size:clamp(1.15rem,3vw,1.4rem);}
.person--lead .bio{font-size:.84rem;}

/* 人员网格 */
.people{
  display:grid;gap:12px;
  grid-template-columns:repeat(auto-fit,minmax(268px,1fr));
}
.people--tight{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));}
.people--single{grid-template-columns:1fr;}

/* ===== 议事机构 ===== */
.council{
  background:linear-gradient(180deg,#fcf6e8,#f1e6d0);
  border:1px solid rgba(132,99,47,.5);
  border-radius:2px;
  box-shadow:0 14px 30px -22px rgba(60,42,20,.6);
  overflow:hidden;
}
.council-top{
  display:flex;align-items:center;gap:11px;
  padding:14px 20px;
  border-bottom:1px solid rgba(132,99,47,.22);
  background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(176,138,74,.08));
}
.council-top .ico{width:24px;height:24px;flex:none;color:var(--gold-dp);}
.council-top .ico svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.5;}
.council-top h3{
  font-family:"Noto Serif SC",serif;font-weight:700;letter-spacing:.12em;
  font-size:1rem;margin:0;
}
.council-top .en{
  font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--gold-dp);margin-left:auto;
}
.council-body{padding:14px 16px 16px;}
.council-note{
  font-size:.73rem;color:var(--ink-soft);letter-spacing:.04em;
  margin:0 2px 10px;
}

/* ===== 部委面板 ===== */
.cabinet{
  display:grid;gap:14px;
  grid-template-columns:repeat(auto-fit,minmax(196px,1fr));
}
.panel{
  background:linear-gradient(180deg,#fcf6e8,#f1e6d0);
  border:1px solid rgba(132,99,47,.42);
  border-radius:2px;
  box-shadow:0 12px 26px -22px rgba(60,42,20,.6);
  display:flex;flex-direction:column;
  overflow:hidden;
}
.panel-top{
  display:flex;align-items:center;gap:9px;
  padding:12px 14px;
  border-bottom:1px solid rgba(132,99,47,.2);
  background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(176,138,74,.07));
}
.panel-top .ico{width:22px;height:22px;flex:none;color:var(--gold-dp);}
.panel-top .ico svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.5;}
.panel-top h3{
  font-family:"Noto Serif SC",serif;font-weight:700;letter-spacing:.1em;
  font-size:.92rem;margin:0;
}
.panel-top .en{
  font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gold-dp);margin-left:auto;
}
.panel-body{padding:12px;display:grid;gap:10px;flex:1;}
.panel-body .person{padding:13px 14px;flex-direction:column;align-items:flex-start;gap:10px;}
.panel-body .avatar{width:52px;height:52px;}
.panel-body .bio{font-size:.75rem;}

/* 选民层 */
.voter-panel{
  background:linear-gradient(180deg,#fcf6e8,#f1e6d0);
  border:1px solid rgba(132,99,47,.42);border-radius:2px;
  padding:16px;
  box-shadow:0 12px 26px -22px rgba(60,42,20,.6);
}

/* ===== 页脚 ===== */
.foot-note{
  margin:clamp(26px,4vw,40px) auto 0;max-width:820px;text-align:center;
  font-size:.78rem;line-height:1.9;color:var(--ink-soft);letter-spacing:.04em;
}
.foot-note .sep{
  display:block;width:60px;height:1px;margin:0 auto 16px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
footer{
  text-align:center;margin-top:22px;font-size:10px;letter-spacing:.3em;
  text-transform:uppercase;color:rgba(106,90,70,.7);
}

/* ===== 弹窗 ===== */
.modal{
  position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(40,30,18,.55);backdrop-filter:blur(3px);
}
.modal[hidden]{display:none;}
.sheet{
  width:min(460px,100%);max-height:88vh;overflow:auto;
  background:linear-gradient(180deg,#fdf8ec,#f3e8d2);
  border:1px solid rgba(132,99,47,.6);border-radius:2px;
  padding:22px 24px 20px;
  box-shadow:0 30px 60px -30px rgba(30,20,10,.8);
  animation:pop .22s ease;
}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px);}to{opacity:1;transform:none;}}
.sheet h3{
  font-family:"Noto Serif SC",serif;font-weight:700;letter-spacing:.1em;
  font-size:1.05rem;margin:0 0 16px;padding-bottom:12px;
  border-bottom:1px solid rgba(132,99,47,.22);
}
.field{margin-bottom:14px;}
.field label{
  display:block;font-size:.74rem;letter-spacing:.1em;color:var(--ink-soft);margin-bottom:6px;
}
.field input[type=text],.field input[type=url],.field textarea{
  width:100%;font-family:inherit;font-size:.86rem;color:var(--ink);
  padding:9px 11px;border:1px solid rgba(132,99,47,.42);border-radius:2px;
  background:rgba(255,255,255,.62);outline:none;line-height:1.6;
}
.field input:focus,.field textarea:focus{border-color:var(--gold-dp);background:#fffdf6;}
.field textarea{resize:vertical;min-height:76px;}
.avatar-row{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
.avatar-row .avatar{width:70px;height:70px;}
.file-in{display:none;}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;}
.btn--seal{color:#7a2620;border-color:rgba(140,47,40,.45);background:rgba(140,47,40,.07);}
.btn--seal:hover{background:rgba(140,47,40,.12);}
.btn--plain{color:var(--ink-soft);}

/* 导出长图时冻结入场动画，避免截图瞬间抓到透明状态 */
.is-capture .tier{animation:none !important;opacity:1 !important;transform:none !important;}
.is-capture .person,.is-capture .panel,.is-capture .council{transition:none !important;}

/* ===== 响应式 ===== */
@media (max-width:640px){
  .person{padding:13px 14px;}
  .avatar{width:54px;height:54px;}
  .person--lead .avatar{width:70px;height:70px;}
  .council-top .en{margin-left:0;}
  .council-top{flex-wrap:wrap;}
  .panel-top .en{display:none;}
  .people{grid-template-columns:1fr;}
}
@media print{
  body{background:#fff;padding:10mm;}
  .person,.panel,.council{box-shadow:none;}
  .tier{animation:none;}
  .toolbar,.add,.del,.hint{display:none;}
  .modal{display:none;}
}
body.readonly .del,body.readonly [data-add]{display:none !important;}
body.readonly .person{cursor:default;}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== 页眉 ===== -->
  <header class="hero">
    <svg class="crown" viewBox="0 0 64 44" aria-hidden="true">
      <path d="M5 30 L13 11 L24 23 L32 6 L40 23 L51 11 L59 30 Z" stroke="#84642f" stroke-width="1.4" fill="none"/>
      <path d="M7 36 H57" stroke="#84642f" stroke-width="1.4"/>
      <circle cx="13" cy="8" r="2.4" fill="#8c2f28"/>
      <circle cx="32" cy="3" r="2.4" fill="#8c2f28"/>
      <circle cx="51" cy="8" r="2.4" fill="#8c2f28"/>
    </svg>
    <p class="kicker">Loriate Free Federation</p>
    <h1>洛亚提自由联邦</h1>
    <div class="rule"><span></span></div>
    <p class="sub">国家职位表 · ORDER OF OFFICES</p>

    <div class="toolbar">
      <button class="btn btn--main" id="btn-poster">导出长图 · 4K</button>
      <button class="btn btn--plain" id="btn-export">导出名单</button>
      <button class="btn btn--plain" id="btn-import">导入名单</button>
      <button class="btn btn--ghost" id="btn-reset">恢复默认</button>
      <input type="file" id="import-file" class="file-in" accept="application/json">
    </div>
    <span class="hint">点击任一成员卡片即可修改姓名、职务、简介与头像</span>
  </header>

  <!-- 各层由脚本渲染到此 -->
  <main id="board"></main>

  <!-- ===== 说明 ===== -->
  <div class="foot-note">
    <span class="sep"></span>
    层级自元首向下延伸：元首 — 宗教 — 上仪会（首相）— 五部 — 下仪会（领主）— 皇室成员 — 选民。
  </div>
  <footer>Loriate Free Federation</footer>
</div>

<!-- ===== 编辑弹窗 ===== -->
<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h3 id="modal-title">编辑成员</h3>

    <div class="avatar-row">
      <div class="avatar" id="m-avatar"></div>
      <div>
        <button class="btn" id="m-upload">更换头像</button>
        <button class="btn btn--plain" id="m-clear" style="margin-left:6px;">清除头像</button>
        <input type="file" id="m-file" class="file-in" accept="image/*">
      </div>
    </div>

    <div class="field">
      <label for="m-name">姓名</label>
      <input type="text" id="m-name" placeholder="例如：JaLi">
    </div>
    <div class="field">
      <label for="m-title">职务</label>
      <input type="text" id="m-title" placeholder="例如：元首">
    </div>
    <div class="field">
      <label for="m-bio">简介</label>
      <textarea id="m-bio" placeholder="一句话介绍职责、履历或所属领地"></textarea>
    </div>

    <div class="actions">
      <button class="btn btn--seal" id="m-del">移除成员</button>
      <button class="btn btn--plain" id="m-cancel">取消</button>
      <button class="btn" id="m-save">保存</button>
    </div>
  </div>
</div>

<script>

const STORE_KEY = 'loriate-office-v2';

/* 名单存云端 offices 表：任何设备看到同一份；只有服主能改 */
const CLOUD = { client: null, ready: false, owner: false };

const TITLE_BY_GROUP = {
  head:'元首', faith:'宗教领袖', upper:'上仪会议员', lower:'领主', royal:'皇室成员', voter:'选民'
};

/* ===================== 数据读写 ===================== */
let state = loadState();
let editing = null;   // { group, id }

function clone(obj){ return JSON.parse(JSON.stringify(obj)); }

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const data = JSON.parse(raw);
      if(data && data.head && data.ministries){
        migrateState(data);
        return data;
      }
    }
  }catch(e){}
  return clone(DEFAULTS);
}

// 旧版本的头像是本地相对路径，导出长图时会让画布被污染（无法保存图片），统一转成内联头像
function migrateState(data){
  const all = [];
  // 新增的层级（如宗教）在旧数据里不存在，补一份默认值
  ['head','faith','upper','lower','royal','voter'].forEach(k => {
    if(!Array.isArray(data[k])) data[k] = clone(DEFAULTS[k] || []);
  });
  if(!data.ministries) data.ministries = clone(DEFAULTS.ministries);
  MINISTRIES.forEach(m => {
    if(!Array.isArray(data.ministries[m.key])) data.ministries[m.key] = clone(DEFAULTS.ministries[m.key] || []);
  });

  ['head','faith','upper','lower','royal','voter'].forEach(k => {
    if(Array.isArray(data[k])) all.push.apply(all, data[k]);
  });
  if(data.ministries){
    Object.keys(data.ministries).forEach(k => {
      if(Array.isArray(data.ministries[k])) all.push.apply(all, data.ministries[k]);
    });
  }
  all.forEach(p => {
    if(p && typeof p.avatar === 'string' && p.avatar.indexOf('assets/') === 0) p.avatar = HEAD_AVATAR;
  });
}

function saveState(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  }catch(e){
    alert('本机缓存写入失败，可能是头像图片过大。请换一张小一点的图片，或先导出名单备份。');
  }
  /* 云端保存：只有服主能写，其他人到不了这里 */
  if(!CLOUD.owner || !CLOUD.client || !CLOUD.ready){ return; }
  try{
    CLOUD.client.from('offices').upsert({
      id: 'roster', data: state, updated_at: new Date().toISOString()
    }).then(function(r){
      if(r && r.error){
        alert('保存到云端失败：' + r.error.message + '\n名单已存在本机，可点「导出名单」先备份。');
      }
    });
  }catch(e){}
}

function uid(){ return 'p-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,6); }

function getList(group){
  if(group.indexOf('min:') === 0) return state.ministries[group.slice(4)] || [];
  return state[group] || [];
}

/* ===================== 渲染 ===================== */
const board = document.getElementById('board');
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;');

function avatarHTML(p){
  if(p.avatar){
    return '<img src="' + esc(p.avatar) + '" alt="' + esc(p.name) + '">';
  }
  return '<span class="ph">' + ICONS.person + '</span>';
}

function personHTML(p, group, lead){
  return '' +
  '<article class="person' + (lead ? ' person--lead' : '') + '" data-group="' + group + '" data-id="' + p.id + '" tabindex="0">' +
    '<div class="avatar">' + avatarHTML(p) + '</div>' +
    '<div class="pbody">' +
      '<div class="plead"><h3>' + esc(p.name) + '</h3></div>' +
      '<span class="prole">' + esc(p.title) + '</span>' +
      '<p class="bio">' + esc(p.bio) + '</p>' +
    '</div>' +
    '<button class="del" data-act="del" aria-label="移除" title="移除成员">×</button>' +
  '</article>';
}

function peopleHTML(list, group, lead, tight){
  const cls = 'people' + (tight ? ' people--tight' : '') + (list.length === 1 && !lead ? ' people--single' : '');
  return '<div class="' + cls + '">' + list.map(p => personHTML(p, group, lead)).join('') + '</div>';
}

function tierHead(idx, name, en, addGroup){
  return '<div class="tier-head">' +
    '<span class="idx">' + idx + '</span>' +
    '<h2>' + name + '</h2>' +
    '<span class="en">' + en + '</span>' +
    (addGroup ? '<button class="add" data-add="' + addGroup + '">+ 添加</button>' : '') +
  '</div>';
}

function councilHTML(opts){
  return '<div class="council">' +
    '<div class="council-top">' +
      '<div class="ico">' + opts.icon + '</div>' +
      '<h3>' + opts.name + '</h3>' +
      '<span class="en">' + opts.en + '</span>' +
    '</div>' +
    '<div class="council-body">' +
      (opts.note ? '<p class="council-note">' + opts.note + '</p>' : '') +
      peopleHTML(opts.list, opts.group, false, true) +
    '</div>' +
  '</div>';
}

function render(){
  let html = '';

  // 壹 · 元首
  html += '<section class="tier">' + tierHead('壹','元首','Head of State', null) +
          peopleHTML(state.head, 'head', true) + '</section>';
  html += '<div class="link"></div>';

  // 贰 · 宗教
  html += '<section class="tier">' + tierHead('贰','宗教','Faith','faith') +
          councilHTML({
            name:'宗教', en:'Faith', icon:ICONS.faith, group:'faith',
            list:state.faith, note:'教务由宗教领袖主持，向元首负责。'
          }) + '</section>';
  html += '<div class="link"></div>';

  // 叁 · 上仪会（首相）
  html += '<section class="tier">' + tierHead('叁','上仪会','Upper Council','upper') +
          councilHTML({
            name:'上仪会', en:'Upper Council', icon:ICONS.scroll, group:'upper',
            list:state.upper, note:'上仪会由首相主持，统辖诸部，向元首负责。'
          }) + '</section>';
  html += '<div class="link"></div>';

  // 肆 · 五部
  let cabinet = '';
  MINISTRIES.forEach(m => {
    const list = state.ministries[m.key] || [];
    cabinet += '<div class="panel">' +
      '<div class="panel-top">' +
        '<div class="ico">' + m.icon + '</div>' +
        '<h3>' + m.name + '</h3>' +
        '<span class="en">' + m.en + '</span>' +
      '</div>' +
      '<div class="panel-body">' + peopleHTML(list, 'min:' + m.key, false) + '</div>' +
    '</div>';
  });
  html += '<section class="tier">' + tierHead('肆','五部','Five Ministries', null) +
          '<div class="cabinet">' + cabinet + '</div>' + '</section>';
  html += '<div class="link"></div>';

  // 伍 · 下仪会（领主）
  html += '<section class="tier">' + tierHead('伍','下仪会','Lower Council','lower') +
          councilHTML({
            name:'下仪会', en:'Lower Council', icon:ICONS.castle, group:'lower',
            list:state.lower, note:'下仪会由各领地领主组成，共议地方事务。'
          }) + '</section>';
  html += '<div class="link"></div>';

  // 陆 · 皇室成员
  html += '<section class="tier">' + tierHead('陆','皇室成员','Royal Household','royal') +
          peopleHTML(state.royal, 'royal', false, true) + '</section>';
  html += '<div class="link"></div>';

  // 柒 · 选民
  html += '<section class="tier">' + tierHead('柒','选民','Electorate','voter') +
          '<div class="voter-panel">' + peopleHTML(state.voter, 'voter', false, true) + '</div>' +
          '</section>';

  board.innerHTML = html;
}

const modal    = document.getElementById('modal');
const mAvatar  = document.getElementById('m-avatar');
const mName    = document.getElementById('m-name');
const mTitle   = document.getElementById('m-title');
const mBio     = document.getElementById('m-bio');
const mFile    = document.getElementById('m-file');
let   pendingAvatar = '';

function findPerson(group, id){
  return getList(group).find(p => p.id === id) || null;
}

function openEditor(group, id){
  const p = findPerson(group, id);
  if(!p) return;
  editing = { group, id };
  pendingAvatar = p.avatar || '';
  mName.value  = p.name;
  mTitle.value = p.title;
  mBio.value   = p.bio;
  paintModalAvatar();
  modal.hidden = false;
  setTimeout(() => mName.focus(), 30);
}

function closeEditor(){
  modal.hidden = true;
  editing = null;
  pendingAvatar = '';
  mFile.value = '';
}

function paintModalAvatar(){
  mAvatar.innerHTML = pendingAvatar
    ? '<img src="' + esc(pendingAvatar) + '" alt="">'
    : '<span class="ph">' + ICONS.person + '</span>';
}

// 图片压缩成 256×256 方图，避免撑爆 localStorage
function shrinkImage(file, done){
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const size = 256;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const s = Math.min(img.width, img.height);
    ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
    URL.revokeObjectURL(url);
    done(c.toDataURL('image/jpeg', 0.82));
  };
  img.onerror = () => { URL.revokeObjectURL(url); alert('这张图片读不出来，换一张试试。'); };
  img.src = url;
}

document.getElementById('m-upload').addEventListener('click', () => mFile.click());
document.getElementById('m-clear').addEventListener('click', () => {
  pendingAvatar = '';
  paintModalAvatar();
});
mFile.addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  shrinkImage(f, data => { pendingAvatar = data; paintModalAvatar(); });
});

document.getElementById('m-save').addEventListener('click', () => {
  if(!editing) return;
  const p = findPerson(editing.group, editing.id);
  if(!p) return;
  p.name  = mName.value.trim() || '（待填写）';
  p.title = mTitle.value.trim() || TITLE_BY_GROUP[editing.group] || '';
  p.bio   = mBio.value.trim();
  p.avatar = pendingAvatar;
  saveState();
  render();
  closeEditor();
});

document.getElementById('m-del').addEventListener('click', () => {
  if(!editing) return;
  const list = getList(editing.group);
  const p = findPerson(editing.group, editing.id);
  if(!p) return;
  if(!confirm('确定移除「' + p.name + '」？')) return;
  const i = list.indexOf(p);
  if(i > -1) list.splice(i, 1);
  saveState();
  render();
  closeEditor();
});

document.getElementById('m-cancel').addEventListener('click', closeEditor);
modal.addEventListener('click', e => { if(e.target === modal) closeEditor(); });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && !modal.hidden) closeEditor();
  if((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('person')){
    e.preventDefault();
    openEditor(e.target.dataset.group, e.target.dataset.id);
  }
});

/* ===================== 交互委托 ===================== */
board.addEventListener('click', e => {
  if(!CLOUD.owner){ alert('只有服主可以修改官员名单，其他成员只读查看。'); return; }
  const del = e.target.closest('[data-act="del"]');
  if(del){
    const card = del.closest('.person');
    const group = card.dataset.group;
    const p = findPerson(group, card.dataset.id);
    if(p && confirm('确定移除「' + p.name + '」？')){
      const list = getList(group);
      const i = list.indexOf(p);
      if(i > -1) list.splice(i, 1);
      saveState();
      render();
    }
    return;
  }
  const add = e.target.closest('[data-add]');
  if(add){
    const group = add.dataset.add;
    const list = getList(group);
    const person = { id:uid(), name:'新成员', title:TITLE_BY_GROUP[group] || '', avatar:'', bio:'点击卡片补充简介。' };
    list.push(person);
    saveState();
    render();
    openEditor(group, person.id);
    return;
  }
  const card = e.target.closest('.person');
  if(card) openEditor(card.dataset.group, card.dataset.id);
});

  const reader = new FileReader();
  reader.onload = () => {
    try{

  saveState();
  render();
});

/* ===================== 导出 4K 长图 ===================== */
const POSTER_WIDTH = 3840;      // 长图宽度固定 4K
const POSTER_CSS_WIDTH = 1240;  // 截图时使用的版心宽度，保证五部排成一整排

function loadHtml2Canvas(){
  if(window.html2canvas) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://fastly.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
    s.onload = resolve;
    s.onerror = () => reject(new Error('cdn'));
    document.head.appendChild(s);
  });
}

document.getElementById('btn-poster').addEventListener('click', async () => {
  const btn     = document.getElementById('btn-poster');
  const wrap    = document.querySelector('.wrap');
  const toolbar = document.querySelector('.toolbar');
  const hint    = document.querySelector('.hint');
  const label   = btn.textContent;
  const prevPad = wrap.style.padding;
  const prevW   = wrap.style.width;
  const prevMax = wrap.style.maxWidth;

  btn.disabled = true;
  btn.textContent = '生成中…';

  try{
    await loadHtml2Canvas();
    if(document.fonts && document.fonts.ready) await document.fonts.ready;

    // 截图时隐藏工具条，固定版心宽度，并给内容加一圈留白
    toolbar.style.display = 'none';
    hint.style.display = 'none';
    wrap.classList.add('is-capture');
    wrap.style.padding = '44px 40px';
    wrap.style.width = POSTER_CSS_WIDTH + 'px';
    wrap.style.maxWidth = 'none';
    await new Promise(r => setTimeout(r, 120));

    const cssH = Math.round(wrap.scrollHeight);
    const scale = POSTER_WIDTH / POSTER_CSS_WIDTH;

    const canvas = await html2canvas(wrap, {
      scale: scale,
      backgroundColor: '#efe4cd',
      useCORS: true,
      logging: false,
      width: POSTER_CSS_WIDTH,
      height: cssH,
      windowWidth: POSTER_CSS_WIDTH,
      windowHeight: cssH,
      scrollX: 0,
      scrollY: 0
    });

    canvas.toBlob(blob => {
      if(!blob){
        alert('长图生成失败，请换用 Chrome 或 Edge 再试一次。');
        return;
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '洛亚提职位表-4K长图.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    }, 'image/png');

  }catch(err){
    alert('长图生成失败：' + (err.message === 'cdn'
      ? '绘图组件没能加载，请检查网络后重试。'
      : (err.message || '未知错误')));
  }finally{
    toolbar.style.display = '';
    hint.style.display = '';
    wrap.classList.remove('is-capture');
    wrap.style.padding = prevPad;
    wrap.style.width = prevW;
    wrap.style.maxWidth = prevMax;
    btn.disabled = false;
    btn.textContent = label;
  }
});

/* ===================== 权限与云端 ===================== */
function applyGate(){
  var ro = !CLOUD.owner;
  document.body.classList.toggle('readonly', ro);
  ['btn-import','btn-reset'].forEach(function(id){
    var b = document.getElementById(id);
    if(b){ b.style.display = ro ? 'none' : ''; }
  });
  var hint = document.querySelector('.hint');
  if(hint){ hint.textContent = ro ? '名单由服主维护，其他成员只读查看' : '点击任一成员卡片即可修改姓名、职务、简介与头像'; }
}

/* 嵌在市政厅页面里时，把高度报给上级，避免出现双层滚动条 */
function reportHeight(){
  try{
    if(window.parent && window.parent !== window){
      window.parent.postMessage({ t: 'lyt-office-height', h: document.documentElement.scrollHeight }, '*');
    }
  }catch(e){}
}

async function readCloudCfg(){
  try{
    var r = await fetch('content.json', { cache: 'no-store' });
    if(r.ok){
      var d = await r.json();
      if(d && d.cloud && d.cloud.url && d.cloud.anonKey){ return d.cloud; }
    }
  }catch(e){}
  return CLOUD_FALLBACK;
}

async function bootCloud(){
  var cfg = await readCloudCfg();
  if(!window.supabase || !cfg.url){ reportHeight(); return; }
  try{ CLOUD.client = window.supabase.createClient(cfg.url, cfg.anonKey); }
  catch(e){ reportHeight(); return; }
  /* 1. 判身份：members 里 username 是 gun7z 的才是服主 */
  try{
    var ss = await CLOUD.client.auth.getSession();
    var em = (ss && ss.data && ss.data.session) ? ss.data.session.user : null;
    if(em){
      var m = await CLOUD.client.from('members').select('username').eq('user_id', em.id);
      CLOUD.owner = !!(m && m.data && m.data[0] && String(m.data[0].username).toLowerCase() === 'gun7z');
    }
  }catch(e){}
  /* 2. 拉名单 */
  try{
    var r = await CLOUD.client.from('offices').select('*').eq('id', 'roster');
    if(!r.error){
      CLOUD.ready = true;
      var row = r.data && r.data[0];
      if(row && row.data && row.data.head){ state = row.data; }
    }
  }catch(e){}
  applyGate();
  render();
  reportHeight();
  if(CLOUD.owner && !CLOUD.ready){
    var hint = document.querySelector('.hint');
    if(hint){ hint.textContent = '云端名单表还没建立：先在 Supabase 运行 supabase.sql 里的 offices 段，否则改动只有本机可见'; }
  }
}

/* ===================== 启动 ===================== */
render();
applyGate();
bootCloud();
window.addEventListener('load', function(){ reportHeight(); setTimeout(reportHeight, 800); });
window.addEventListener('resize', reportHeight);
</script>
