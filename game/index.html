<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Gun7z的一天 · 洛亚提办公厅</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;900&family=Roboto+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bone:#e8dfc9;
    --bone-dim:#9aa091;
    --moss:#7d9b62;
    --red:#b4462f;
    --serif:"Noto Serif SC","Songti SC",serif;
    --mono:"Roboto Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{font-family:var(--serif);color:var(--bone)}

  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000;touch-action:none}

  /* ---------- 首屏：接听 ---------- */
  #igate{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;text-align:center;padding:6vh 24px;
    background:radial-gradient(120% 80% at 50% 45%,rgba(30,44,34,.55),#000 72%);
    transition:opacity .75s ease}
  #igate.hide{opacity:0;pointer-events:none}
  #igate .g-sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.34em;color:var(--moss);opacity:.85}
  #igate h2{margin:0;font-size:clamp(26px,8vw,46px);font-weight:900;letter-spacing:.14em;
    text-shadow:0 0 26px rgba(180,70,47,.28)}
  #igate .g-line{margin:0;font-size:13px;line-height:2;color:var(--bone-dim);opacity:.9}
  #iplay{margin-top:6px;font-family:var(--serif);font-size:17px;letter-spacing:.3em;color:var(--bone);
    background:linear-gradient(180deg,rgba(52,72,54,.55),rgba(24,34,26,.75));
    border:1px solid rgba(125,155,98,.55);border-radius:6px;padding:14px 40px;cursor:pointer;
    box-shadow:0 0 0 1px rgba(0,0,0,.6),0 10px 30px rgba(0,0,0,.6)}
  #iplay:active{transform:translateY(1px);border-color:var(--moss)}
  #igate .g-note{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:#6f766a;margin-top:4px}

  /* ---------- 结束提示 ---------- */
  #tip{position:fixed;left:0;right:0;bottom:calc(10% + env(safe-area-inset-bottom,0px));z-index:9;
    text-align:center;font-family:var(--mono);font-size:11.5px;letter-spacing:.26em;color:#9aa091;
    opacity:0;transition:opacity .8s ease;pointer-events:none}
  #tip.on{opacity:1;animation:breath 2.8s ease-in-out infinite}
  @keyframes breath{0%,100%{opacity:.45}50%{opacity:.9}}

  @media (prefers-reduced-motion:reduce){
    #tip.on{animation:none;opacity:.8}
  }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="igate">
  <div class="g-sub">序 · 03:47</div>
  <h2>洛亚提办公厅</h2>
  <p class="g-line">凌晨三点四十七分。铃声响起，手机在桌上亮着。<br>
    来电显示是你自己的号码。<br>
    你按下接听——窗外的雨停在半空，一粒一粒，变成方块。</p>
  <button id="iplay" type="button">拿 起 手 机</button>
  <div class="g-note">他是谁？</div>
</div>


<div id="tip">轻触屏幕 · 重播</div>

<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var SERIF = '"Noto Serif SC","Songti SC",serif';
  var MONO = '"Roboto Mono",Consolas,monospace';

  /* 时间轴（毫秒） */
  var TL = {
    wake:   800,    // 手机亮起
    banner: 1500,   // 来电横幅
    answer: 2500,   // 接通
    hangup: 9200,   // 熄屏
    title:  9600,   // 标题
    end:    13200   // 结束，出重播提示
  };

  /* ---------------- 基础工具 ---------------- */
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function ease(t) { return 1 - Math.pow(1 - clamp01(t), 3); }
  function lerp(a, b, t) { return a + (b - a) * clamp01(t); }
  function hash(n) { var x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); }

  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  function vignette(a) {
    var g = ctx.createRadialGradient(W / 2, H * 0.46, Math.min(W, H) * 0.26, W / 2, H * 0.46, Math.max(W, H) * 0.8);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,' + a + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function grain(ms) {
    if (RM) return;
    for (var i = 0; i < 40; i++) {
      var x = hash(i + ms * 0.02) * W;
      var y = hash(i * 2.7 + ms * 0.017) * H;
      ctx.fillStyle = 'rgba(228,234,220,' + (0.02 + hash(i * 9.1) * 0.05).toFixed(3) + ')';
      ctx.fillRect(x, y, 1, 1);
    }
  }

  /* ---------------- 空气里的尘埃 ---------------- */
  var dust = [];
  function seedDust() {
    dust = [];
    var n = Math.min(90, Math.round(W * H / 20000));
    for (var i = 0; i < n; i++) {
      dust.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 0.6 + Math.random() * 1.5,
        v: 0.02 + Math.random() * 0.07,
        p: Math.random() * 6.28,
        a: 0.05 + Math.random() * 0.15
      });
    }
  }
  function drawDust(ms, a) {
    if (a <= 0.02) return;
    for (var i = 0; i < dust.length; i++) {
      var d = dust[i];
      var y = d.y - ms * d.v * 0.001 * 60;
      y = ((y % H) + H) % H;
      var x = d.x + Math.sin(ms / 2600 + d.p) * 10;
      ctx.fillStyle = 'rgba(196,206,186,' + (d.a * a).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(x, y, d.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* ---------------- 手机 ---------------- */
  // 画机身与屏幕，屏幕内容交给回调，坐标为屏幕自身中心
  function phoneFrame(cx, cy, w, tilt, mine, glow, fn) {
    var h = w * 2.04;
    var sw = w * 0.92, sh = h * 0.955;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(tilt);

    // 机身背后的屏幕溢光
    var g = ctx.createRadialGradient(0, 0, 0, 0, 0, w * 2.1);
    g.addColorStop(0, 'rgba(74,100,78,' + (0.20 * glow).toFixed(3) + ')');
    g.addColorStop(0.45, 'rgba(48,66,52,' + (0.06 * glow).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(-w * 2.1, -w * 2.1, w * 4.2, w * 4.2);

    // 机身
    var body = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
    body.addColorStop(0, '#191d1e');
    body.addColorStop(0.12, '#0e1213');
    body.addColorStop(1, '#040607');
    rr(-w / 2, -h / 2, w, h, w * 0.086);
    ctx.fillStyle = body;
    ctx.fill();
    ctx.strokeStyle = 'rgba(198,208,194,.14)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // 屏幕
    rr(-sw / 2, -sh / 2, sw, sh, w * 0.066);
    ctx.fillStyle = '#040706';
    ctx.fill();

    ctx.save();
    rr(-sw / 2, -sh / 2, sw, sh, w * 0.066);
    ctx.clip();
    fn(sw, sh);
    // 屏幕亮度（熄屏时为黑）
    if (mine < 1) {
      ctx.fillStyle = 'rgba(0,0,0,' + (1 - mine).toFixed(3) + ')';
      ctx.fillRect(-sw / 2, -sh / 2, sw, sh);
    }
    ctx.restore();

    // 玻璃反光
    var rf = ctx.createLinearGradient(-sw / 2, -sh / 2, sw / 2, sh * 0.35);
    rf.addColorStop(0, 'rgba(224,232,218,.075)');
    rf.addColorStop(0.34, 'rgba(224,232,218,0)');
    rf.addColorStop(1, 'rgba(224,232,218,0)');
    rr(-sw / 2, -sh / 2, sw, sh, w * 0.066);
    ctx.fillStyle = rf;
    ctx.fill();

    // 刘海
    ctx.fillStyle = '#080b0a';
    rr(-w * 0.14, -sh / 2 + w * 0.016, w * 0.28, w * 0.044, w * 0.022);
    ctx.fill();
    ctx.fillStyle = 'rgba(120,140,120,.18)';
    ctx.beginPath();
    ctx.arc(w * 0.065, -sh / 2 + w * 0.038, w * 0.014, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  /* ---------------- 镜头一：锁屏，来电 ---------------- */
  function drawLock(sw, sh, t) {
    var bg = ctx.createLinearGradient(0, -sh / 2, 0, sh / 2);
    bg.addColorStop(0, '#0c1311');
    bg.addColorStop(0.55, '#070b09');
    bg.addColorStop(1, '#040706');
    ctx.fillStyle = bg;
    ctx.fillRect(-sw / 2, -sh / 2, sw, sh);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // 锁屏时间
    var ts = Math.min(sw * 0.26, sh * 0.105);
    ctx.font = '300 ' + ts + 'px ' + MONO;
    ctx.fillStyle = 'rgba(228,234,216,.62)';
    ctx.fillText('03:47', 0, -sh * 0.305);

    ctx.font = (ts * 0.24) + 'px ' + MONO;
    ctx.fillStyle = 'rgba(152,164,146,.42)';
    ctx.fillText('洛亚提自由联邦 · 办公厅', 0, -sh * 0.228);

    // 来电横幅
    if (t >= TL.banner) {
      var bt = ease((t - TL.banner) / 430);
      var bw = sw * 0.88, bh = sh * 0.094;
      var by = lerp(-sh * 0.44, -sh * 0.138, bt);

      ctx.save();
      ctx.globalAlpha = bt;
      rr(-bw / 2, by, bw, bh, bh * 0.2);
      ctx.fillStyle = 'rgba(19,25,21,.94)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(125,155,98,.20)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // 头像
      var ar = bh * 0.27;
      var ax = -bw / 2 + bh * 0.15;
      rr(ax, by + bh / 2 - ar, ar * 2, ar * 2, ar * 0.62);
      ctx.fillStyle = 'rgba(34,44,36,.95)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(125,155,98,.25)';
      ctx.stroke();
      ctx.font = '900 ' + (ar * 1.0) + 'px ' + SERIF;
      ctx.fillStyle = 'rgba(214,210,192,.8)';
      ctx.fillText('办', ax + ar, by + bh / 2 + ar * 0.04);

      // 文字
      var tx = ax + ar * 2 + bw * 0.045;
      ctx.textAlign = 'left';
      ctx.font = '700 ' + (bh * 0.28) + 'px ' + SERIF;
      ctx.fillStyle = 'rgba(228,224,208,.95)';
      ctx.fillText('洛亚提办公厅', tx, by + bh * 0.38);
      ctx.font = (bh * 0.19) + 'px ' + MONO;
      ctx.fillStyle = 'rgba(150,162,144,.82)';
      ctx.fillText('值班专线 · 来电中', tx, by + bh * 0.73);
      ctx.restore();
    }

    // 接听 / 挂断 两个圆（提示该按下去）
    var bt2 = clamp01((t - TL.banner - 260) / 420);
    if (bt2 > 0) {
      var r = Math.min(sw * 0.085, sh * 0.045);
      var cy2 = sh * 0.285;
      var dx = sw * 0.20;
      var pulse = RM ? 1 : 1 + Math.sin(t / 380) * 0.035;

      ctx.save();
      ctx.globalAlpha = bt2;
      // 左：挂断
      ctx.beginPath();
      ctx.arc(-dx, cy2, r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(96,48,38,.55)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(170,92,70,.28)';
      ctx.lineWidth = 1;
      ctx.stroke();
      // 右：接听
      ctx.beginPath();
      ctx.arc(dx, cy2, r * pulse, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(56,86,58,.72)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(125,170,110,.5)';
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.font = (r * 0.40) + 'px ' + MONO;
      ctx.fillStyle = 'rgba(146,156,138,.85)';
      ctx.fillText('挂断', -dx, cy2 + r + r * 0.55);
      ctx.fillText('接听', dx, cy2 + r + r * 0.55);
      ctx.restore();
    }
  }


  /* ---------------- 镜头二：通话中 ---------------- */
  function drawCall(sw, sh, lm, t) {
    ctx.fillStyle = '#060a08';
    ctx.fillRect(-sw / 2, -sh / 2, sw, sh);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    var fs = Math.max(9, sw * 0.058);

    // 顶栏
    ctx.textAlign = 'left';
    ctx.font = (fs * 0.66) + 'px ' + MONO;
    ctx.fillStyle = 'rgba(158,170,150,.7)';
    ctx.fillText(PH_CLOCK, -sw * 0.42, -sh / 2 + fs * 1.15);
    ctx.textAlign = 'right';
    ctx.fillText('87%', sw * 0.42, -sh / 2 + fs * 1.15);

    // 通话中 + 计时
    var sec = Math.floor(lm / 1000) + 1;
    var tick = '00:' + (sec < 10 ? '0' : '') + sec;
    ctx.textAlign = 'center';
    ctx.font = (fs * 0.74) + 'px ' + MONO;
    ctx.fillStyle = 'rgba(125,155,98,.92)';
    ctx.fillText('通话中　' + tick, 0, -sh * 0.32);

    // 头像
    var av = Math.min(sw * 0.2, sh * 0.072);
    var avY = -sh * 0.232;
    rr(-av / 2, avY, av, av, av * 0.16);
    ctx.fillStyle = 'rgba(30,40,34,.95)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(125,155,98,.32)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.font = '900 ' + (av * 0.5) + 'px ' + SERIF;
    ctx.fillStyle = 'rgba(212,208,192,.75)';
    ctx.fillText('办', 0, avY + av * 0.53);

    // 机构名
    var ns = Math.min(sw * 0.104, fs * 1.95);
    ctx.font = '900 ' + ns + 'px ' + SERIF;
    ctx.fillStyle = 'rgba(230,226,210,.96)';
    ctx.fillText('洛亚提办公厅', 0, -sh * 0.072);

    // 线路
    ctx.font = (ns * 0.42) + 'px ' + MONO;
    ctx.fillStyle = 'rgba(150,162,144,.85)';
    ctx.fillText('值班专线 · 分机 0347', 0, -sh * 0.018);

    // 声波
    var bars = 20;
    var bw = sw * 0.026, gap = sw * 0.012;
    var totalW = bars * bw + (bars - 1) * gap;
    var baseY = sh * 0.068;
    for (var i = 0; i < bars; i++) {
      var ph = lm / 175 + i * 0.82;
      var amp = 0.14 + Math.abs(Math.sin(ph)) * 0.66 * (0.42 + hash(i * 3.1) * 0.58);
      var hgt = Math.max(2, sh * 0.062 * amp);
      var bx = -totalW / 2 + i * (bw + gap);
      ctx.fillStyle = 'rgba(125,155,98,' + (0.28 + amp * 0.58).toFixed(2) + ')';
      ctx.fillRect(bx, baseY - hgt / 2, bw, hgt);
    }

    // 小字
    ctx.font = (ns * 0.36) + 'px ' + MONO;
    ctx.fillStyle = 'rgba(118,128,112,.82)';
    ctx.fillText('加密线路 · 通话将被记录', 0, sh * 0.128);

    // 底部三个键
    var r = Math.min(sw * 0.07, sh * 0.030);
    var btnY = sh * 0.255;
    var dx = sw * 0.21;
    var btns = [
      { x: -dx, t: '静音', a: 0.32 },
      { x: 0, t: '挂断', a: 0.46, red: true },
      { x: dx, t: '免提', a: 0.32 }
    ];
    for (var k = 0; k < btns.length; k++) {
      var b = btns[k];
      ctx.beginPath();
      ctx.arc(b.x, btnY, r, 0, Math.PI * 2);
      ctx.fillStyle = b.red ? 'rgba(118,50,38,' + b.a.toFixed(2) + ')' : 'rgba(44,56,46,' + b.a.toFixed(2) + ')';
      ctx.fill();
      ctx.lineWidth = 1;
      ctx.strokeStyle = b.red ? 'rgba(160,84,64,.34)' : 'rgba(125,155,98,.20)';
      ctx.stroke();
      ctx.font = (ns * 0.33) + 'px ' + MONO;
      ctx.fillStyle = 'rgba(138,148,130,.75)';
      ctx.fillText(b.t, b.x, btnY + r + ns * 0.40);
    }
  }

  /* ---------------- 镜头三：标题 ---------------- */
  function spaced(text, x, y, size, gap, color, alpha, weight) {
    ctx.save();
    ctx.font = (weight || '900') + ' ' + size + 'px ' + SERIF;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    ctx.globalAlpha = alpha;

    var chars = text.split('');
    var widths = [];
    var total = 0;
    var i;
    for (i = 0; i < chars.length; i++) {
      widths[i] = ctx.measureText(chars[i]).width;
      total += widths[i];
    }
    total += gap * (chars.length - 1);

    var cx = x - total / 2;
    for (i = 0; i < chars.length; i++) {
      ctx.fillText(chars[i], cx, y);
      cx += widths[i] + gap;
    }
    ctx.restore();
  }

  function drawTitle(t) {
    var p = clamp01((t - TL.title) / 2700);
    var a = ease(clamp01((t - TL.title) / 800));

    var rg = ctx.createRadialGradient(W / 2, H * 0.5, 0, W / 2, H * 0.5, Math.max(W, H) * 0.55);
    rg.addColorStop(0, 'rgba(120,40,30,' + (0.08 + p * 0.07).toFixed(3) + ')');
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);

    // 电流抖动
    var fk = 1;
    if (!RM) {
      var lm = t - TL.title;
      if (lm > 420 && lm < 560) fk = 0.35 + Math.random() * 0.4;
      else if (lm > 1400 && lm < 1500) fk = 0.6;
    }

    // 标题：5 字自动缩到画面 88% 内
    var size = Math.min(W * 0.15, H * 0.11, 104);
    var gap = size * 0.07;
    ctx.font = '900 ' + size + 'px ' + SERIF;
    var wid = 0;
    var chars = '洛亚提办公厅'.split('');
    for (var i = 0; i < chars.length; i++) wid += ctx.measureText(chars[i]).width;
    wid += gap * (chars.length - 1);
    if (wid > W * 0.88) {
      size *= (W * 0.88) / wid;
      gap = size * 0.07;
      wid = W * 0.88;
    }

    var ty = H * 0.48;

    // 小标
    ctx.save();
    ctx.globalAlpha = a * fk * 0.75;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '500 ' + (size * 0.24) + 'px ' + MONO;
    ctx.fillStyle = '#9aa38f';
    ctx.fillText('洛 亚 提 联 邦', W / 2, ty - size * 0.82);
    ctx.restore();

    // 主标题
    ctx.save();
    ctx.shadowColor = 'rgba(180,70,47,.5)';
    ctx.shadowBlur = size * 0.32;
    spaced('洛亚提办公厅', W / 2, ty, size, gap, '#e8dfc9', a * fk, '900');
    ctx.restore();

    // 红线
    var lw = W * 0.32 * clamp01((t - TL.title - 700) / 1200);
    if (lw > 1) {
      ctx.save();
      ctx.globalAlpha = 0.7 * a;
      ctx.fillStyle = '#b4462f';
      ctx.fillRect(W / 2 - lw / 2, ty + size * 0.62, lw, 2);
      ctx.restore();
    }

    // 副标
    ctx.save();
    ctx.globalAlpha = clamp01((t - TL.title - 900) / 900) * fk;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = Math.max(10, size * 0.20) + 'px ' + MONO;
    ctx.fillStyle = 'rgba(142,152,134,.85)';
    ctx.fillText('办公厅 · 值班室', W / 2, ty + size * 1.16);
    ctx.fillStyle = 'rgba(112,120,106,.7)';
    ctx.fillText('EXT · 0347', W / 2, ty + size * 1.5);
    ctx.restore();
  }

  /* ---------------- 合成：按阶段调度 ---------------- */
  var stage = 'gate';        // gate → ring → call → home / app，或 ring → kill → dead
  var segT0 = 0;
  var FRZ = -1;             // 调试：#f=阶段:毫秒 冻结在该帧
  var hotspots = [];         // 当前可点区域（CSS 像素）
  var lastEl = 0;

  function elNow() { return performance.now() - segT0; }

  /* ---------- 背景底板 ---------- */
  function stageBg(glow, el) {
    var rg = ctx.createRadialGradient(W / 2, H * 0.46, 0, W / 2, H * 0.46, Math.max(W, H) * 0.62);
    rg.addColorStop(0, 'rgba(48,64,52,' + (0.22 * glow).toFixed(3) + ')');

  function qqFlow(items, sw, sh, fs, clipTop, clipBot, hotFn) {

    var baseY, maxS = 0;

      baseY = clipTop + sh * 0.015;
      qqScroll = 0;
    } else {
      maxS = total - area + sh * 0.02;
      qqScroll = Math.max(0, Math.min(maxS, qqScroll));
      baseY = clipBot - sh * 0.02 - total + qqScroll;
    }
    qqScrollMax = maxS;

    ctx.save();
    ctx.beginPath();
    ctx.rect(-sw / 2, clipTop, sw, area);
    ctx.clip();

    var y = baseY;
    for (var i = 0; i < items.length; i++) {

  // 按宽度折行（中文够用）
  function wrapLines(str, maxW, size) {
    var out = [], cur = '';
    for (var i = 0; i < str.length; i++) {
      var ch = str.charAt(i);
      // 标点不许单独起一行，宁可让上一行多挤一个字
      if (cur && ctx.measureText(cur + ch).width > maxW && !/^[，。！？…、；：」』）]/.test(ch)) { out.push(cur); cur = ch; }
      else cur += ch;
    }
    if (cur) out.push(cur);
    // 末行只剩标点、或只剩一两个字，就并回上一行，免得吊在半空
    while (out.length > 1) {
      var last = out[out.length - 1];
      if (/^[，。！？…、；：」』）]+$/.test(last) || last.length <= 2) {
        out[out.length - 2] += last;
        out.pop();
      } else break;
    }
    return out;
  }

  // QQ 的交互
  function qqAction(id) {
    if (id.indexOf('key:') === 0) {
      var k = id.slice(4);
      if (k === '退') { qqPass = qqPass.slice(0, -1); cueTap(); return; }
      if (k === '登') { qqSubmit(); return; }
      if (qqPass.length < 8) { qqPass += k; cueTap(); }
      return;
    }
    if (id.indexOf('tab:') === 0) { qqTab = id.slice(4); qqView = 'list'; cueTap(); return; }
    if (id.indexOf('pcm:') === 0) { qqPc = +id.slice(4); qqView = 'pchat'; qqScroll = 0; cueTap(); return; }
    if (id.indexOf('send:') === 0) {
      qqSend(id === 'send:0' ? 0 : 1);
      return;
    }
    if (id === 'group') {
      // 已经看完就不用重播；看了一半就接着走
      qqView = 'chat';
      qqScroll = 0;
      qqChatT0 = qqChatDone ? -99999999 : elNow() - Math.max(0, qqChatShown - 1) * QQ_STEP;
      cueTap();
      return;
    }
    if (id === 'chatback') {
      if (qqView === 'chat') {
        qqChatShown = qqShownCount(elNow());
        qqChatDone = qqChatShown >= QQ_CHAT.length;
      }
      qqScroll = 0;
      qqView = 'list';
      cueTap();
      return;
    }
    if (id === 'latest') { qqScroll = 0; cueTap(); return; }
    if (id === 'accept') {
      qqJoined = true;
      qqTab = 'msg';
      qqView = 'list';
      tone(420, 640, 0.16, 'sine', 0.02);
      tone(640, 900, 0.18, 'sine', 0.014);
      return;
    }
    if (id === 'reject') {           // 拒绝 → 暗杀线
      if (AC) { cueHang(); }
      setStage('kill');
      return;
    }
  }

      // 门框 / 桌沿
      ctx.strokeStyle = 'rgba(140,140,124,.13)';
      ctx.lineWidth = 2;
      ctx.strokeRect(sw * 0.14, -sh * 0.05, sw * 0.20, sh * 0.48);
      ctx.strokeRect(-sw * 0.36, sh * 0.10, sw * 0.22, sh * 0.26);

      // 椅子上的人影（越看越大）
      var grow = Math.min(1, t / 4.2);
      ctx.fillStyle = 'rgba(5,7,6,.92)';
      ctx.beginPath();
      ctx.ellipse(-sw * 0.14, -sh * 0.03, sw * (0.075 + grow * 0.015), sh * (0.125 + grow * 0.015), -0.04, 0, 6.283);
      ctx.fill();
      ctx.fillRect(-sw * 0.235, -sh * 0.02, sw * (0.15 + grow * 0.03), sh * 0.30);

      // 两点眼睛
      if (t > 2.4) {
        var bl = (Math.sin(t * 5.5) > -0.7) ? 1 : 0.2;
        ctx.fillStyle = 'rgba(226,220,200,' + (0.62 * bl) + ')';
        ctx.beginPath();
        ctx.ellipse(-sw * 0.196, -sh * 0.078, sw * 0.0062, sh * 0.0072, 0, 0, 6.283);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(-sw * 0.108, -sh * 0.080, sw * 0.0062, sh * 0.0072, 0, 0, 6.283);
        ctx.fill();
      }

      // 4.0 秒：脸贴上来（只闪一下）
      if (t > 4.0 && t < 4.55) {
        cgFace(-sw * 0.02, -sh * 0.10, sw * 0.30, (t < 4.18 ? 0.95 : 0.55), -0.50);
      }
      // 之后脸慢慢靠近，边缘都是黑的
      if (t > 4.6) {
        var k = Math.min(1, (t - 4.6) / 1.8);
        ctx.save();
        var vig = ctx.createRadialGradient(0, -sh * 0.06, sw * 0.10, 0, -sh * 0.06, sw * 0.62);
        vig.addColorStop(0, 'rgba(0,0,0,0)');
        vig.addColorStop(1, 'rgba(0,0,0,.92)');
        cgFace(sw * 0.10, -sh * 0.09, sw * (0.24 + k * 0.14), 0.55 + k * 0.30, -0.62);
        ctx.fillStyle = vig;
        ctx.fillRect(-sw / 2, -sh / 2, sw, sh);
        ctx.restore();
      }
      cgGrain(sw, sh, t > 4.4);
    }

    if (i === 1) {
      // 三层的门：门缝里的光，门后站着人
      var open = Math.min(1, t / 4.0);
      ctx.fillStyle = 'rgba(212,202,176,' + (0.06 + 0.42 * open) + ')';
      ctx.fillRect(-sw * 0.01, -sh * 0.26, sw * (0.02 + open * 0.10), sh * 0.76);
      // 两片门
      ctx.fillStyle = 'rgba(5,7,6,.95)';
      ctx.fillRect(-sw * 0.40, -sh * 0.32, sw * 0.36, sh * 0.82);
      ctx.fillRect(sw * 0.10, -sh * 0.32, sw * 0.30, sh * 0.82);

      // 门后那个人（只是一块更暗的形状）
      var pIn = Math.max(0, t - 1.4);
      if (pIn > 0) {
        var hgt = sh * (0.40 + Math.min(0.45, pIn * 0.18));
        ctx.fillStyle = 'rgba(3,5,4,.97)';
        ctx.beginPath();
        ctx.ellipse(0, sh * 0.06, sw * 0.075, hgt * 0.24, 0, 0, 6.283);
        ctx.fill();
        ctx.fillRect(-sw * 0.072, 0, sw * 0.14, hgt * 0.62);
      }
      if (t > 3.2) {
        var e = Math.min(1, (t - 3.2) * 1.8);
        ctx.fillStyle = 'rgba(230,224,204,' + (0.75 * e) + ')';
        ctx.beginPath();
        ctx.ellipse(-sw * 0.030, -sh * 0.085, sw * 0.0052, sh * 0.0062, 0, 0, 6.283);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(sw * 0.030, -sh * 0.085, sw * 0.0052, sh * 0.0062, 0, 0, 6.283);
        ctx.fill();
      }
      // 5.2 秒：门缝黑掉，人已经不在门里
      if (t > 5.2) {
        ctx.fillStyle = 'rgba(3,4,4,.96)';
        ctx.fillRect(-sw / 2, -sh / 2, sw, sh);
        // 原来站在那里的东西已经在屏幕边缘
        var edge = Math.min(1, (t - 5.2) / 0.9);
        ctx.fillStyle = 'rgba(9,11,10,.75)';
        ctx.fillRect(-sw / 2 + sw * (1 - edge) * 0.6, -sh / 2, sw * 0.42, sh);
        var blink2 = (Math.sin(t * 9) > -0.5) ? 1 : 0.25;
        ctx.fillStyle = 'rgba(232,226,206,' + (0.7 * blink2 * edge) + ')';
        ctx.beginPath();
        ctx.ellipse(-sw * 0.32, -sh * 0.10, sw * 0.0058, sh * 0.0068, 0, 0, 6.283);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(-sw * 0.245, -sh * 0.102, sw * 0.0058, sh * 0.0068, 0, 0, 6.283);
        ctx.fill();
      }
      // 白闪一下收尾
      if (t > 6.5 && t < 6.72) {
        ctx.fillStyle = 'rgba(226,232,214,.85)';
        ctx.fillRect(-sw / 2, -sh / 2, sw, sh);
      }
      cgGrain(sw, sh, t > 5.0);
    }

    if (i === 2) {
      // 魔法阵：红圈在转，阵里躺着一个人
      var rot = t * 0.5;
      var R = sw * 0.31;
      var cy2 = sh * 0.05;
      ctx.save();
      ctx.translate(0, cy2);
      ctx.strokeStyle = 'rgba(170,58,44,.85)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, R, 0, 6.283);
      ctx.stroke();
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.arc(0, 0, R * 0.76, 0, 6.283);
      ctx.stroke();
      for (var k2 = 0; k2 < 12; k2++) {
        var a2 = rot + k2 * 6.283 / 12;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a2) * R * 0.76, Math.sin(a2) * R * 0.76);
        ctx.lineTo(Math.cos(a2) * R * 1.00, Math.sin(a2) * R * 1.00);
        ctx.stroke();
      }
      ctx.restore();

      // 躺着的人：被一只手往右拖
      var drag = Math.min(1, Math.max(0, (t - 2.4) / 2.4));
      ctx.fillStyle = 'rgba(8,10,9,.95)';
      ctx.beginPath();
      ctx.ellipse(-sw * 0.03 + drag * sw * 0.20, cy2 - sh * 0.075, sw * 0.048, sh * 0.038, 0, 0, 6.283);
      ctx.fill();
      ctx.fillRect(-sw * 0.09 + drag * sw * 0.20, cy2 - sh * 0.05, sw * 0.16, sh * 0.19);

      if (t > 1.2) {
        var arm = Math.min(1, (t - 1.2) / 1.0);
        ctx.strokeStyle = 'rgba(112,102,92,' + (0.55 * arm) + ')';
        ctx.lineWidth = sw * 0.014;
        ctx.beginPath();
        ctx.moveTo(sw * 0.42, cy2 + sh * 0.20);
        ctx.lineTo(sw * (0.12 - 0.10 * arm) + drag * sw * 0.20, cy2 + sh * 0.12);
        ctx.stroke();
      }

      // 4.4 秒：阵心塌成一块黑，里面有两点眼睛
      if (t > 4.4) {
        var k3 = Math.min(1, (t - 4.4) / 0.8);
        ctx.fillStyle = 'rgba(2,3,3,' + (0.85 * k3) + ')';
        ctx.beginPath();
        ctx.ellipse(0, cy2, R * 0.72 * k3, R * 0.72 * k3, 0, 0, 6.283);
        ctx.fill();
        ctx.fillStyle = 'rgba(232,224,204,' + (0.70 * k3) + ')';
        ctx.beginPath();
        ctx.ellipse(-R * 0.16, cy2 - R * 0.06, sw * 0.0055, sh * 0.0065, 0, 0, 6.283);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(R * 0.16, cy2 - R * 0.06, sw * 0.0055, sh * 0.0065, 0, 0, 6.283);
        ctx.fill();
      }
      if (t > 6.2 && t < 6.4) {
        ctx.fillStyle = 'rgba(150,36,26,.80)';
        ctx.fillRect(-sw / 2, -sh / 2, sw, sh);
      }
      cgGrain(sw, sh, t > 4.2);
    }

    // 老胶片上下黑边 + 扫描线
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.fillRect(-sw / 2, -sh / 2, sw, sh * 0.045);
    ctx.fillRect(-sw / 2, sh * 0.455, sw, sh * 0.045);
    for (var s2 = 0; s2 < 16; s2++) {
      ctx.fillStyle = 'rgba(255,255,255,.018)';
      ctx.fillRect(-sw / 2, -sh / 2 + s2 * sh * 0.058, sw, 1);
    }
  }

    t = t < 0 ? 0 : t > 1 ? 1 : t;
    var px = x1 + vx * t, py = y1 + vy * t;
    var dx = u - px, dy = v - py;
    return dx * dx + dy * dy <= r * r;

    if (capHit(u, v, 0.66, 0.235, 0.795, 0.560, 0.056)) return true;  // 右臂

        var jy = (hash(c * 8.3 + r * 2.9) - 0.5) * ch * 0.10;
        var s = 8 + Math.floor(hash(c + r * 31.7) * 4) * 4;   // 8/12/16/20
        var sx = Math.floor(hash(c * 2.3 + r * 9.1) * 8) * 8;
        var sy = Math.floor(hash(c * 6.7 + r * 4.4) * 8) * 8;

      shY = (Math.random() - 0.5) * amp;

      shY = (Math.random() - 0.5) * 4;
    }

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    var roomA = clamp01((el - K.room + 700) / 1100) * (1 - clamp01((el - K.strike) / 500));

    ctx.save();
    ctx.translate(shX, shY);

    if (roomA > 0.02) drawRoom(el, roomA);

    // 它：远处蹲着 → 抬头 → 站起 → 扑过来 → 俯在脸上

      var t1 = clamp01((el - (K.room + 500)) / (K.rise - K.room - 500));
      var t2 = clamp01((el - K.rise) / (K.stand - K.rise));
      var t3 = clamp01((el - K.stand) / (K.rush - K.stand));
      var t4 = clamp01((el - K.rush) / (K.strike - K.rush));

      var hh, feet, alpha;
      var lean = 0.02 + t1 * 0.03 + t3 * 0.10 + ease(t4) * 0.16;

        hh = H * 0.96 + q * 0.10;

      vg.addColorStop(0, 'rgba(0,0,0,0)');
      vg.addColorStop(0.5, 'rgba(26,4,3,' + (0.22 * closeA).toFixed(3) + ')');
      vg.addColorStop(1, 'rgba(0,0,0,' + (0.5 + 0.5 * closeA).toFixed(3) + ')');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }

    // 全黑
    if (el > K.dark) {
      var ba = clamp01((el - K.dark) / 700);
      ctx.fillStyle = 'rgba(0,0,0,' + ba.toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    grain(el);
    vignette(el > K.strike ? 0.8 : 0.62);
  }


  function drawSlash(el) {
    var p = clamp01((el - (K.strike - 30)) / 440);
    ctx.save();
    ctx.globalAlpha = (1 - p) * 0.9;
    ctx.translate(W * (1.15 - p * 1.5), -H * 0.1 + p * H * 0.9);
    for (var i = 0; i < 3; i++) {
      ctx.strokeStyle = i ? 'rgba(226,234,220,' + (0.55 - i * 0.14).toFixed(2) + ')' : 'rgba(255,255,255,.85)';
      ctx.lineWidth = 2 + i * 1.6;
      ctx.beginPath();
      ctx.moveTo(-W * 0.1 + i * W * 0.06, -H * 0.35);
      ctx.quadraticCurveTo(W * 0.3 + i * W * 0.05, 0, -W * 0.05 + i * W * 0.07, H * 0.5);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* ---------- 阶段五：手机关机之后（强开机 / 玩电脑） ---------- */
  var PC_LEN = 16000;      // 电脑开机这一段有多长
  var pcOn = false;        // 玩过电脑没有
  var pcHint = 0;          // 「强开机」按了没反应的时间戳

  // 黑屏之后，右边浮出来的两个选项
  function offOptions() {
    var bt = Math.min(52, H * 0.068);
    var bw = Math.min(W * 0.29, 176);
    var g0 = homeGeom();
    var pr0 = g0.cx + g0.w * 0.46;                       // 手机屏幕右边界
    var bxr = W - bw - Math.min(30, W * 0.055);
    var bx = Math.max(pr0 + 12, bxr);                    // 桌面够宽就推到屏外
    if (bx + bw > W - 6) bx = bxr;
    var gap = bt * 0.40;
    var top = H * 0.5 - bt - gap * 0.5;
    var items = [{ id: 'off:power', t: '强开机' }, { id: 'off:pc', t: '玩电脑' }];
    rr(bx - 12, top - 14, bw + 24, bt * 2 + gap + 28, 6);
    ctx.fillStyle = 'rgba(0,0,0,.62)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(150,170,140,.10)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    items.forEach(function (it, i) {
      var y = top + i * (bt + gap);
      rr(bx, y, bw, bt, 4);
      ctx.fillStyle = 'rgba(20,24,20,.88)';
      ctx.fill();
      ctx.strokeStyle = i ? 'rgba(152,182,122,.46)' : 'rgba(150,168,140,.26)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.font = '600 ' + Math.max(13, bt * 0.30) + 'px ' + SERIF;
      ctx.fillStyle = i ? 'rgba(208,218,192,.94)' : 'rgba(166,176,158,.66)';
      ctx.fillText(it.t, bx + bw / 2, y + bt / 2);
      hotspots.push({ id: it.id, x: bx + bw / 2, y: y + bt / 2, r: bt * 0.62, hw: bw / 2 + 8, hh: bt / 2 + 8 });
    });

    // 强开机按了没反应，就摆一句在这儿
    if (pcHint) {
      var d = (performance.now() - pcHint) / 1000;
      if (d < 2.2) {
        ctx.globalAlpha = d > 1.4 ? (1 - clamp01((d - 1.4) / 0.8)) : 1;
        ctx.textAlign = 'center';
        ctx.font = Math.max(11, W * 0.024) + 'px ' + MONO;
        ctx.fillStyle = 'rgba(176,150,128,.78)';
        ctx.fillText('按了，没反应。', bx + bw / 2, top + bt * 2 + gap + Math.max(20, bt * 0.55));
        ctx.globalAlpha = 1;
      } else { pcHint = 0; }
    }
  }

  // 开机之后的桌面（CG 尾段和静止画面都用它）——按屏幕左上角给出的一块矩形画
  function pcDesktop(t, x0, y0, sw, sh, cosy) {
    // 壁纸
    var wg = ctx.createLinearGradient(0, y0, 0, y0 + sh);
    wg.addColorStop(0, '#0a1612');
    wg.addColorStop(0.55, '#07100d');
    wg.addColorStop(1, '#040a08');
    ctx.fillStyle = wg;
    ctx.fillRect(x0, y0, sw, sh);

    // 淡淡的网格（像方块世界的地平线）
    ctx.strokeStyle = 'rgba(110,160,120,.06)';
    ctx.lineWidth = 1;
    for (var gx = x0; gx < x0 + sw; gx += Math.max(22, sw * 0.085)) {
      ctx.beginPath(); ctx.moveTo(gx, y0 + sh * 0.40); ctx.lineTo(gx, y0 + sh); ctx.stroke();
    }
    for (var gy = y0 + sh * 0.40; gy < y0 + sh; gy += Math.max(18, sh * 0.055)) {
      ctx.beginPath(); ctx.moveTo(x0, gy); ctx.lineTo(x0 + sw, gy); ctx.stroke();
    }

    // 桌面图标
    var s2 = Math.max(14, sw * 0.066);
    [{ t: '内网', i: 0 }, { t: '档案', i: 1 }, { t: '回收站', i: 2 }].forEach(function (o) {
      var iy = y0 + sh * (0.13 + o.i * 0.24);
      rr(x0 + sw * 0.10 - s2 / 2, iy - s2 * 0.55, s2, s2, 3);
      ctx.fillStyle = 'rgba(150,180,140,.13)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(150,180,140,.22)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.font = Math.max(8, sh * 0.048) + 'px ' + MONO;
      ctx.fillStyle = 'rgba(190,206,180,.60)';
      ctx.fillText(o.t, x0 + sw * 0.10, iy + s2 * 0.52);
    });

    // 任务栏
    var tbH = sh * 0.085;
    ctx.fillStyle = 'rgba(10,16,13,.94)';
    ctx.fillRect(x0, y0 + sh - tbH, sw, tbH);
    ctx.fillStyle = 'rgba(120,160,110,.20)';
    ctx.fillRect(x0, y0 + sh - tbH, sw, 1);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = '600 ' + Math.max(8, sh * 0.062) + 'px ' + MONO;
    ctx.fillStyle = 'rgba(196,208,186,.78)';
    ctx.fillText('开 始', x0 + sw * 0.045, y0 + sh - tbH / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(176,190,170,.62)';
    ctx.fillText('05:12', x0 + sw * 0.955, y0 + sh - tbH / 2);

    // 桌面上一个光标，慢慢闪
    if (cosy && (Math.floor(t / 620) % 2 === 0)) {
      ctx.fillStyle = 'rgba(210,220,200,.55)';
      ctx.fillRect(x0 + sw * 0.52, y0 + sh * 0.46, 1.5, Math.max(8, sh * 0.035));
    }
  }

  function drawPC(el) {
    var cx = W / 2, cy = H * 0.455;
    var mw = Math.min(W * 0.88, H * 0.66), mh = mw * 0.63;
    var mx0 = cx - mw / 2, my0 = cy - mh / 2;
    var tw = Math.min(W * 0.115, 78), th = tw * 2.5;
    var tx = Math.max(48, mx0 - tw * 0.55);

    // 房间
    ctx.fillStyle = '#040605';
    ctx.fillRect(0, 0, W, H);
    var lamp = ctx.createRadialGradient(cx, my0 + mh * 0.35, 0, cx, my0 + mh * 0.35, Math.max(W, H) * 0.85);
    lamp.addColorStop(0, 'rgba(96,110,82,.10)');
    lamp.addColorStop(0.4, 'rgba(40,48,38,.045)');
    lamp.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = lamp;
    ctx.fillRect(0, 0, W, H);

    // 桌子
    var deskY = my0 + mh + mh * 0.055;
    ctx.fillStyle = 'rgba(15,19,16,.94)';
    ctx.fillRect(0, deskY, W, H - deskY);
    ctx.fillStyle = 'rgba(150,170,140,.12)';
    ctx.fillRect(0, deskY, W, 1);

    // 机箱 + 指示灯
    rr(tx, deskY - th * 0.86, tw, th * 0.86, 3);
    ctx.fillStyle = 'rgba(11,14,12,.98)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(140,160,130,.14)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = 'rgba(160,180,150,.10)';
    ctx.fillRect(tx + tw * 0.12, deskY - th * 0.80, tw * 0.76, 2);
    ctx.fillRect(tx + tw * 0.12, deskY - th * 0.74, tw * 0.76, 2);

    var ledOn = el > 1100;
    var ledA = ledOn ? 1 : (Math.floor(el / 700) % 2 ? 0.55 : 0.06);
    ctx.fillStyle = 'rgba(' + (ledOn ? '120,230,140,' : '230,190,120,') + ledA + ')';
    ctx.beginPath();
    ctx.arc(tx + tw * 0.5, deskY - th * 0.62, Math.max(2.5, tw * 0.055), 0, 6.283);
    ctx.fill();

    // 显示器外壳
    rr(mx0, my0, mw, mh, 4);
    ctx.fillStyle = 'rgba(10,13,11,.97)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(140,158,132,.18)';
    ctx.lineWidth = 1;
    ctx.stroke();
    // 支架
    ctx.fillStyle = 'rgba(10,13,11,.97)';
    ctx.fillRect(cx - mw * 0.05, my0 + mh, mw * 0.10, mh * 0.055);
    ctx.fillRect(cx - mw * 0.14, deskY - 4, mw * 0.28, 6);

    // 屏幕
    var sx0 = mx0 + mw * 0.026, sy0 = my0 + mh * 0.030;
    var sww = mw * 0.948, shh = mh * 0.865;
    ctx.save();
    rr(sx0, sy0, sww, shh, 3);
    ctx.fillStyle = '#030504';
    ctx.fill();
    ctx.clip();

    var k = el / 1000;
    if (el < 1050) {
      // 熄着，只有一点反光
      ctx.fillStyle = 'rgba(70,86,66,.05)';
      ctx.fillRect(sx0, sy0, sww, shh * 0.4);
    } else if (el < 1400) {
      // 白线一下撑开
      var o = (el - 1050) / 350;
      var hh2 = Math.max(2, shh * o);
      ctx.fillStyle = 'rgba(214,224,204,' + (0.55 + 0.4 * o) + ')';
      ctx.fillRect(sx0, sy0 + (shh - hh2) / 2, sww, hh2);
    } else {
      // 显像管亮起来
      var br = clamp01((el - 1400) / 900);
      ctx.fillStyle = 'rgba(18,30,24,' + (0.35 + br * 0.55) + ')';
      ctx.fillRect(sx0, sy0, sww, shh);
      var glow = ctx.createRadialGradient(sx0 + sww / 2, sy0 + shh / 2, 0, sx0 + sww / 2, sy0 + shh / 2, sww * 0.9);
      glow.addColorStop(0, 'rgba(120,190,140,' + (0.10 * br) + ')');
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(sx0, sy0, sww, shh);

      if (el < 6600) {
        // BIOS 自检
        var lines = [
          'LORA BIOS v1.02   (C) 云历 100',
          'CPU  : GUN7Z-CORE 8  3200MHz',
          'MEM  : 65536K ........ OK',
          'DETECTING DEVICES ...',
          '  IDE 0 MASTER : LORAT-ROOM-01',
          '  KEYBOARD .... OK',
          '  MOUSE ....... OK',
          'LOADING BOOT SECTOR ...'
        ];
        var fs2 = Math.min(sww * 0.032, shh * 0.062);
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.font = Math.max(9, fs2) + 'px ' + MONO;
        for (var li = 0; li < lines.length; li++) {
          var at = 2350 + li * 470;
          if (el < at) break;
          var part = Math.min(1, (el - at) / 260);
          var str = lines[li].slice(0, Math.ceil(lines[li].length * part));
          ctx.fillStyle = 'rgba(178,214,168,' + (0.86 * clamp01((el - 1400) / 500)) + ')';
          ctx.fillText(str, sx0 + sww * 0.055, sy0 + shh * 0.075 + li * fs2 * 1.45);
        }
        // 光标
        if (Math.floor(el / 480) % 2 === 0) {
          var cy2 = sy0 + shh * 0.075 + Math.min(lines.length, Math.floor((el - 2350) / 470) + 1) * fs2 * 1.45;
          ctx.fillStyle = 'rgba(178,214,168,.8)';
          ctx.fillRect(sx0 + sww * 0.055, cy2, fs2 * 0.55, fs2 * 0.9);
        }
      } else if (el < 7600) {
        // 系统标 + 进度条
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '900 ' + Math.min(sww * 0.13, shh * 0.22) + 'px ' + SERIF;
        ctx.fillStyle = 'rgba(200,224,190,.92)';
        ctx.fillText('LORA', sx0 + sww / 2, sy0 + shh * 0.36);
        ctx.font = (shh * 0.050) + 'px ' + MONO;
        ctx.fillStyle = 'rgba(150,180,140,.62)';
        ctx.fillText('洛亚提 · 内网终端', sx0 + sww / 2, sy0 + shh * 0.53);

        var pw = sww * 0.52, ph = Math.max(3, shh * 0.014);
        var px = sx0 + (sww - pw) / 2, py = sy0 + shh * 0.64;
        ctx.fillStyle = 'rgba(120,150,112,.22)';
        ctx.fillRect(px, py, pw, ph);
        ctx.fillStyle = 'rgba(150,210,140,.85)';
        ctx.fillRect(px, py, pw * clamp01((el - 6600) / 900), ph);
      } else {
        // 桌面
        pcDesktop(el, sx0, sy0, sww, shh, true);
      }
      // 扫描线
      for (var sl = 0; sl < 40; sl++) {
        ctx.fillStyle = 'rgba(0,0,0,.14)';
        ctx.fillRect(sx0, sy0 + sl * (shh / 40), sww, 1);
      }
    }
    ctx.restore();

    // 屏幕玻璃反光
    var rf = ctx.createLinearGradient(sx0, sy0, sx0 + sww, sy0 + shh * 0.6);
    rf.addColorStop(0, 'rgba(220,232,212,.055)');
    rf.addColorStop(0.42, 'rgba(220,232,212,0)');
    rf.addColorStop(1, 'rgba(220,232,212,0)');
    ctx.fillStyle = rf;
    rr(sx0, sy0, sww, shh, 3);
    ctx.fill();

    // 开机那一刻的白闪
    if (el > 1050 && el < 1160) {
      ctx.fillStyle = 'rgba(226,236,216,' + (0.35 * (1 - (el - 1050) / 110)) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    // 右下角的时间码
    ctx.textAlign = 'right';
    ctx.textBaseline = 'alphabetic';
    ctx.font = (H * 0.014) + 'px ' + MONO;
    ctx.fillStyle = 'rgba(150,170,140,.30)';
    ctx.fillText('PC · 05:11', W - 22, H - 20);
  }

  var pclImg = null;

  function pclLogo() {
    if (!pclImg) { pclImg = new Image(); pclImg.src = PCL_SRC; }
    return (pclImg.complete && pclImg.naturalWidth) ? pclImg : null;

  // 桌面上的图标（在开机之后的静止桌面里）
  function pclIcon(x, y, s) {
    var im = pclLogo();
    rr(x - s / 2, y - s / 2, s, s, 3);
    ctx.fillStyle = 'rgba(16,22,18,.92)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(150,180,140,.24)';
    ctx.lineWidth = 1;
    ctx.stroke();
    if (im) {
      ctx.save();
      ctx.globalAlpha = 0.92;
      ctx.drawImage(im, x - s * 0.40, y - s * 0.40, s * 0.80, s * 0.80);
      ctx.restore();
    } else {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '900 ' + (s * 0.44) + 'px ' + SERIF;
      ctx.fillStyle = 'rgba(200,214,190,.85)';
      ctx.fillText('P', x, y + s * 0.02);
    }
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.font = Math.max(8, s * 0.40) + 'px ' + MONO;
    ctx.fillStyle = 'rgba(190,206,180,.62)';
    ctx.fillText('PCL', x, y + s * 0.60);
  }

  // 打开之后的启动器窗口
  function pclWindow(x0, y0, sw, sh) {
    var wx = x0 + sw * 0.10, wy = y0 + sh * 0.11;
    var ww = sw * 0.80, wh = sh * 0.72;

    // 先把桌面压暗
    ctx.fillStyle = 'rgba(2,4,3,.55)';
    ctx.fillRect(x0, y0, sw, sh);

    rr(wx, wy, ww, wh, 4);
    ctx.fillStyle = 'rgba(12,16,14,.97)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(150,180,140,.34)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // 标题栏
    var tbh = Math.max(16, sh * 0.085);
    ctx.fillStyle = 'rgba(22,30,24,.98)';
    ctx.fillRect(wx, wy, ww, tbh);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = Math.max(9, sh * 0.034) + 'px ' + MONO;
    ctx.fillStyle = 'rgba(200,214,192,.88)';
    ctx.fillText('Plain Craft Launcher 2', wx + ww * 0.035, wy + tbh / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(170,184,160,.62)';
    ctx.fillText('×', wx + ww * 0.965, wy + tbh / 2);
    hotspots.push({ id: 'pcl:close', x: wx + ww * 0.955, y: wy + tbh / 2, r: Math.max(14, tbh * 0.62) });

    // Logo + 名字
    var im = pclLogo();
    var ls = Math.min(ww * 0.26, wh * 0.34);
    if (im) {
      ctx.save();
      ctx.globalAlpha = 0.95;
      ctx.drawImage(im, wx + ww * 0.06, wy + tbh + wh * 0.07, ls, ls);
      ctx.restore();
    }

    var tx = wx + ww * 0.06 + ls + ww * 0.045;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.font = Math.max(10, sh * 0.042) + 'px ' + SERIF;
    ctx.fillStyle = 'rgba(226,232,214,.92)';
    ctx.fillText('SIMMC 推荐整合 1.3', tx, wy + tbh + wh * 0.10);
    ctx.font = Math.max(8, sh * 0.030) + 'px ' + MONO;
    ctx.fillStyle = 'rgba(150,170,142,.66)';
    ctx.fillText('Fabric 1.21 · 288 个文件 · 65 个模组', tx, wy + tbh + wh * 0.26);

    // 分隔线
    ctx.fillStyle = 'rgba(130,160,124,.20)';
    ctx.fillRect(wx + ww * 0.05, wy + tbh + wh * 0.42, ww * 0.90, 1);

    // 日志
    var logs = [
      '校验游戏文件 ... 288 / 288',
      '加载模组 ... 65 个',
      '分配内存 4096 MB',
      '连接 play.simmc.cn ...'
    ];
    var ly = wy + tbh + wh * 0.40;
    ctx.font = Math.max(9, sh * 0.030) + 'px ' + MONO;
    var shown = pclRun ? Math.min(logs.length, Math.floor((performance.now() - pclT0) / 900) + 1) : 0;
    for (var i = 0; i < logs.length; i++) {
      if (i >= shown) break;
      ctx.fillStyle = 'rgba(168,196,158,.62)';
      ctx.fillText('> ' + logs[i], wx + ww * 0.06, ly + i * sh * 0.032);
    }

    // 进度条 + 按钮
    var by = wy + wh - Math.max(26, wh * 0.20);
    var pgr = pclRun ? Math.min(1, (performance.now() - pclT0) / 4200) : 0;
    var pw = ww * 0.62, ph = Math.max(4, sh * 0.014);
    ctx.fillStyle = 'rgba(120,150,112,.20)';
    ctx.fillRect(wx + ww * 0.06, by - sh * 0.026, pw, ph);
    ctx.fillStyle = pclDone ? 'rgba(150,210,140,.9)' : 'rgba(140,190,130,.82)';
    ctx.fillRect(wx + ww * 0.06, by - sh * 0.026, pw * pgr, ph);

    var bw2 = ww * 0.30, bh2 = Math.max(20, sh * 0.085);
    var bx2 = wx + ww - bw2 - ww * 0.05;
    rr(bx2, by, bw2, bh2, 3);
    ctx.fillStyle = pclDone ? 'rgba(30,44,30,.95)' : 'rgba(40,62,40,.95)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(150,200,132,.45)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = Math.max(9, sh * 0.034) + 'px ' + SERIF;
    ctx.fillStyle = 'rgba(214,232,200,.95)';
    ctx.fillText(pclDone ? '正在启动' : (pclRun ? '启动中…' : '启动游戏'), bx2 + bw2 / 2, by + bh2 / 2);
    if (!pclRun) hotspots.push({ id: 'pcl:start', x: bx2 + bw2 / 2, y: by + bh2 / 2, r: Math.max(bh2, bw2) * 0.55, hw: bw2 / 2 + 4, hh: bh2 / 2 + 4 });

    if (pclDone) {
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.font = Math.max(8, sh * 0.026) + 'px ' + MONO;
      ctx.fillStyle = 'rgba(176,196,164,.62)';
      ctx.fillText('等待服务端响应…', bx2 - ww * 0.02, by + bh2 / 2);
    }
  }

  // 开机之后停在这块桌面上（右边给一个关机）
  function drawPCD(el) {
    var cx = W / 2, cy = H * 0.455;
    var mw = Math.min(W * 0.88, H * 0.66), mh = mw * 0.63;
    var mx0 = cx - mw / 2, my0 = cy - mh / 2;

    ctx.fillStyle = '#040605';
    ctx.fillRect(0, 0, W, H);
    rr(mx0, my0, mw, mh, 4);
    ctx.fillStyle = 'rgba(10,13,11,.97)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(140,158,132,.18)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = 'rgba(10,13,11,.97)';
    ctx.fillRect(cx - mw * 0.05, my0 + mh, mw * 0.10, mh * 0.055);
    ctx.fillRect(cx - mw * 0.14, my0 + mh + mh * 0.055 - 4, mw * 0.28, 6);

    var sx0 = mx0 + mw * 0.026, sy0 = my0 + mh * 0.030;
    var sww = mw * 0.948, shh = mh * 0.865;
    ctx.save();
    rr(sx0, sy0, sww, shh, 3);
    ctx.clip();
    pcDesktop(now2(), sx0, sy0, sww, shh, true);
    ctx.restore();

    // 桌面上的 PCL 图标；点开就是启动器窗口
    if (!pclOpen) {
      var ics = Math.max(20, sww * 0.070);
      var icx = sx0 + sww * 0.245, icy = sy0 + shh * 0.15;
      pclIcon(icx, icy, ics);
      hotspots.push({ id: 'pcl:open', x: icx, y: icy, r: Math.max(ics, sww * 0.055) * 0.72 });
    } else {
      if (pclRun && !pclDone && performance.now() - pclT0 > 4200) pclDone = true;
      pclWindow(sx0, sy0, sww, shh);
    }

    // 右边：关掉电脑（窗口开着的时候先不摆）
    if (!pclOpen) {
      var bt = Math.min(52, H * 0.068), bw = Math.min(W * 0.29, 176);
      var bx = W - bw - Math.min(30, W * 0.055);
      rr(bx, H * 0.5 - bt / 2, bw, bt, 4);
      ctx.fillStyle = 'rgba(20,24,20,.88)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(152,182,122,.40)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '600 ' + Math.max(13, bt * 0.30) + 'px ' + SERIF;
      ctx.fillStyle = 'rgba(202,214,190,.92)';
      ctx.fillText('关掉电脑', bx + bw / 2, H * 0.5);
      hotspots.push({ id: 'off:pcoff', x: bx + bw / 2, y: H * 0.5, r: bt * 0.62, hw: bw / 2 + 8, hh: bt / 2 + 8 });
    }
  }

  function now2() { return performance.now(); }

  /* ---------- 阶段三：你已死亡 ---------- */
  function drawDead(el) {
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, W, H);

    // 底光：心跳两次然后停
    var pulse = clamp01((el - 300) / 2600);

  /* ---------------- 声音（全部现场合成，无音频文件） ---------------- */
  var AC = null, master = null, noiseBuf = null;
  var cueTimers = [];
  var ringTimer = 0;

  function audioInit() {
    if (AC) return;
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    AC = new C();
    master = AC.createGain();
    master.gain.value = 0.9;
    master.connect(AC.destination);

    var len = Math.floor(AC.sampleRate * 2);
    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }

  function tone(f1, f2, dur, type, g, delay) {
    if (!AC) return;
    var t0 = AC.currentTime + (delay || 0);
    var o = AC.createOscillator();
    var gn = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(Math.max(20, f1), t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f2 || f1), t0 + dur);
    gn.gain.setValueAtTime(0.0001, t0);
    gn.gain.linearRampToValueAtTime(g, t0 + Math.min(0.04, dur * 0.25));
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(gn);
    gn.connect(master);
    o.start(t0);
    o.stop(t0 + dur + 0.03);
  }

  function hiss(dur, type, freq, q, g, delay) {
    if (!AC) return;
    var t0 = AC.currentTime + (delay || 0);
    var src = AC.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;
    var flt = AC.createBiquadFilter();
    flt.type = type || 'bandpass';
    flt.frequency.value = freq || 800;
    flt.Q.value = q || 1;
    var gn = AC.createGain();
    gn.gain.setValueAtTime(0.0001, t0);
    gn.gain.linearRampToValueAtTime(g, t0 + Math.min(0.12, dur * 0.2));
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(flt);
    flt.connect(gn);
    gn.connect(master);
    src.start(t0);
    src.stop(t0 + dur + 0.05);
  }

  function hum(dur, g) {
    if (!AC) return;
    var t0 = AC.currentTime;
    [52, 84].forEach(function (f, i) {
      var o = AC.createOscillator();
      var gn = AC.createGain();
      o.type = 'sine';
      o.frequency.value = f;
      gn.gain.setValueAtTime(0.0001, t0);
      gn.gain.linearRampToValueAtTime(g * (i ? 0.6 : 1), t0 + 0.25);
      gn.gain.setValueAtTime(g * (i ? 0.6 : 1), t0 + dur - 0.4);
      gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(gn);
      gn.connect(master);
      o.start(t0);
      o.stop(t0 + dur + 0.05);
    });
  }

      after(1720, function () { hiss(0.10, 'bandpass', 2400, 2.2, 0.012); });
      after(3020, function () { hiss(0.10, 'bandpass', 2400, 2.2, 0.012); });

      else if (mq[1] === 'notice') { qqState = 'main'; qqTab = 'notice'; qqJoined = false; }
      else if (mq[1] === 'contact') { qqState = 'main'; qqTab = 'contact'; qqJoined = true; }
      else if (mq[1] === 'chat') { qqState = 'main'; qqTab = 'msg'; qqJoined = true; qqView = 'chat'; }
      else if (mq[1] === 'pchat') { qqState = 'main'; qqTab = 'contact'; qqJoined = true; qqView = 'pchat'; }
      else { qqState = 'main'; qqTab = 'msg'; qqJoined = true; }

      var mcq = /(?:^#|&)cq=(\d+)/.exec(location.hash);
      if (mcq) qqForce = Math.floor(+mcq[1] / QQ_STEP);
      else if (mq[1] === 'chat') qqForce = QQ_CHAT.length;

      // s=1：预览"已经回过话"的样子（s=2 看另一条分支）
      if (/(?:^#|&)s=[12]/.test(location.hash)) {
        var sd = /(?:^#|&)s=2/.test(location.hash) ? 'fine' : 'look';
        var rpv = QQ_REPLY[sd];
        qqSent = true;
        qqSentAt = -99999999;
        qqMine = [{ m: 6, own: true, n: 'Gun7z', t: rpv.txt, at: 0, tm: '04:02' }].concat(rpv.after.map(function (a) {
          return { m: a.m, t: a.t, at: 0, tm: a.tm };
        }));
      }
    }
    if (mpc) { qqPc = +mpc[1]; qqState = 'main'; qqTab = 'contact'; qqJoined = true; qqView = 'pchat'; }
    // re=N：预览"看到第 N 条就退出、再点进来接着看"的样子
    var mre = /(?:^#|&)re=(\d+)/.exec(location.hash);
    if (mre) {
      qqState = 'main'; qqJoined = true; qqView = 'chat';
      qqChatDone = false; qqChatShown = +mre[1];
      qqChatT0 = -(qqChatShown - 1) * QQ_STEP;
    }
    var m5 = /(?:^#|&)a=([a-z]+)/.exec(location.hash);
    // 预览：pcf=毫秒 直接看电脑开机 CG；off=1 直接看手机关机后那两个选项
    var mpcl = /(?:^#|&)pcl=([a-z0-9]+)/.exec(location.hash);
    if (mpcl) {
      gate.style.display = 'none';
      setStage('pcd');
      pclOpen = true;
      if (mpcl[1] === 'run') { pclRun = true; pclT0 = performance.now() - 2600; }
    }
    var mpcf = /(?:^#|&)pcf=(\d+)/.exec(location.hash);
    if (mpcf) {
      gate.style.display = 'none';
      setStage('pc', +mpcf[1]);
    }
    var moff = /(?:^#|&)off=1/.test(location.hash);
    if (moff) {
      gate.style.display = 'none';
      appOpen = 'wechat';
      setStage('app', 2400);
      shutFade = 1;
      PH_CLOCK = '05:00';
    }
    if (m5) {
      gate.style.display = 'none';
      appOpen = m5[1];
      setStage('app', 2400);
      // bq=魔法阵：直接看搜过之后的样子；bw=词条：直接开词条页（预览用）
      var mbq = /(?:^#|&)bq=([^&]+)/.exec(location.hash);
      if (mbq) bwSearch(decodeURIComponent(mbq[1]));
      var mbw = /(?:^#|&)bw=([^&]+)/.exec(location.hash);
      if (mbw) bwOpen(decodeURIComponent(mbw[1]));

      // 微信预览：wxs=login|verify|main|me|svc|money，wxb=1 让验证码条挂着
      var mwx = /(?:^#|&)wxs=([a-z]+)/.exec(location.hash);
      if (mwx) {
        var st = mwx[1];
        if (st === 'verify') {
          wxPW = WX_PW; wxPhone = WX_PHONE;
          wxSent = true; wxCoded = true; wxSentAt = performance.now() - 9000;
          wxField = 'code'; wxCode = ''; wxState = 'verify';
        } else if (st === 'info' || st === 'discover' || st === 'moments' || st === 'me' || st === 'svc' || st === 'money' || st === 'main') {
          wxState = st;
          wxTabI = (st === 'main') ? 0 : (st === 'info' ? 1 : (st === 'discover' ? 2 : 3));
          if (st === 'moments') { phAdvance('05:00'); alarmAt = performance.now() + 15000; }
        }
        var msc = /(?:^#|&)wsc=(\d)/.exec(location.hash);
        if (msc) {
          cgIdx = +msc[1];
          wxState = 'cg';
          var mst = /(?:^#|&)wst=([\d.]+)/.exec(location.hash);
          cgT0 = performance.now() - (mst ? (+mst[1]) * 1000 : 0);
          cgCue = [0, 0, 0];
        }
        var mxb = /(?:^#|&)wxb=1/.exec(location.hash);
        if (mxb) { wxCoded = true; wxBannerOn = true; wxBannerAt = performance.now() - 120; }
      }
      var msc2 = /(?:^#|&)wsc=(\d)/.exec(location.hash);
      if (msc2 && !mwx) {
        cgIdx = +msc2[1];
        wxState = 'cg';
        var mst2 = /(?:^#|&)wst=([\d.]+)/.exec(location.hash);
        cgT0 = performance.now() - (mst2 ? (+mst2[1]) * 1000 : 0);
        cgCue = [0, 0, 0];
      }
    }
    raf = requestAnimationFrame(frame);
  })();
})();
</script>
</body>
</html>
